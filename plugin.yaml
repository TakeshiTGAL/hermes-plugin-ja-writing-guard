name: ja-writing-guard
version: 0.1.0
manifest_version: 2
requires_hermes: ">=0.21.4"
api_version: 1
description: >
  Rule-based proofreading for Japanese business text. Finds and fixes the
  AI-style phrasing that often appears in Japanese emails, notices and docs:
  stock phrases, monotonous sentence endings, overused symbols and Markdown,
  English-calque grammar, and register that does not fit where the text goes.
  It checks wording, not authorship: it does not tell whether a person or a
  model wrote the text. A deterministic, offline checker points at each
  pattern with line, column and a fix hint. Every final Japanese answer is
  checked through transform_llm_output and only reported by default. Opt-in
  enforce mode rewrites answers over the threshold with the user's own model
  and delivers the rewrite only if numbers, addressee/company/quoted names,
  weekdays, signature and heading lines, ASCII names, URLs and code survive,
  negation keeps its direction and the score drops under the threshold;
  otherwise the original is delivered. Surfaces: chat, business_email,
  external, sns, tech_doc.
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-ja-writing-guard
tags: [japanese, writing, proofreading, lint, style, editing]

provides_tools:
  - ja_writing_check
provides_hooks:
  - transform_llm_output
  - post_tool_call

config_schema:
  mode:
    type: str
    choices: [off, report, enforce]
    default: report
    label: Mode
    description: "report = check and log only, never change the answer. enforce = rewrite answers over the threshold before delivery (one or two extra calls to your model). off = do nothing."
  surface:
    type: str
    choices: [chat, business_email, external, sns, tech_doc]
    default: chat
    label: Default surface
    description: "Where answers go. business_email and external require です・ます and are strictest; chat is lenient."
  platform_surfaces:
    type: dict
    default: {}
    label: Surface per platform
    description: 'Override the surface per delivery platform, e.g. {"email": "business_email", "slack": "chat"}.'
  threshold:
    type: int
    default: 0
    label: Threshold
    description: "Score (0-100) at which an answer is flagged for its AI-style phrasing. 0 = the surface default (chat 40, business_email 35, external 40, sns 35, tech_doc 45)."
  max_attempts:
    type: int
    default: 2
    label: Rewrite attempts
    description: "Model calls per flagged answer in enforce mode (1-3)."
  rewrite_timeout:
    type: float
    default: 20
    label: Rewrite timeout (seconds)
    description: "Upper limit per model call (also capped by the time left in time_budget). On timeout or error the original answer is delivered."
  time_budget:
    type: float
    default: 25
    label: Time budget (seconds)
    description: "Whole rewrite, all attempts. Values under 5 s are raised to 5 s. Shrunk automatically to 3 s under Hermes' plugins.hook_callback_timeout (default 30 s), which abandons slower hooks. In enforce mode a flagged answer is delivered up to this much later."
  accept_partial:
    type: bool
    default: false
    label: Deliver partial rewrites
    description: "When a rewrite lowers the score but is still over the threshold: false = deliver the original, true = deliver the improved rewrite."
  min_chars:
    type: int
    default: 40
    label: Minimum length
    description: "Answers shorter than this are not checked."
